<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Spotify - SkyNetApi</title>
    <style>
        *{box-sizing:border-box}html,body{margin:0;height:100%;background:#09090f;color:#f5f5f7;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;grid-template-rows:auto 1fr}.head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(9,9,15,.96)}.mark{width:36px;height:36px;border-radius:12px;background:#1ed760;color:#07120a;display:grid;place-items:center;font-weight:950}.copy{min-width:0;flex:1}.copy strong,.copy span{display:block}.copy strong{font-size:14px}.copy span{font-size:11px;color:#92929f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.close{height:34px;padding:0 11px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.05);color:#eee;cursor:pointer}.content{min-height:0;padding:12px}.empty{height:100%;display:grid;place-items:center;text-align:center;padding:28px;color:#92929f;border:1px dashed rgba(255,255,255,.12);border-radius:16px}.empty strong{display:block;color:#f5f5f7;margin-bottom:7px}.frame{width:100%;height:100%;min-height:500px;border:0;border-radius:14px;background:#171717;display:block}
    </style>
</head>
<body>
    <header class="head"><div class="mark">S</div><div class="copy"><strong>Spotify</strong><span id="spotifyPopupStatus">Player persistente do SkyNetApi</span></div><button class="close" id="spotifyPopupClose" type="button">Fechar</button></header>
    <main class="content" id="spotifyPopupRoot"><div class="empty"><div><strong>Nenhum conteúdo carregado</strong>Volte ao SkyNetApi, cole um link do Spotify e clique em Tocar.</div></div></main>
    <script src="/spotify-popup.js"></script>
</body>
</html>
