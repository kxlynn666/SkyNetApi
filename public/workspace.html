<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#050506">
    <title>SkyNetApi Workspace</title>
    <link rel="stylesheet" href="/app.css">
    <link rel="stylesheet" href="/dashboard.css">

<body class="workspace-body">
    <div class="workspace-loading" id="workspaceLoading">
        <div class="workspace-loading-mark">S</div>
        <div>Carregando workspace...</div>
    </div>
    <div class="workspace-shell hidden" id="workspaceShell">
        <aside class="workspace-sidebar" id="workspaceSidebar"></aside>
        <div class="workspace-main">
            <header class="workspace-topbar">
                <button class="workspace-menu-button" id="workspaceMenuButton" type="button" aria-label="Abrir menu">Menu</button>
                <div class="workspace-heading">
                    <div class="workspace-kicker" id="workspaceKicker"></div>
                    <h1 id="workspaceTitle"></h1>
                    <p id="workspaceDescription"></p>
                </div>
                <div class="workspace-user-chip" id="workspaceUserChip"></div>
            </header>
            <main class="workspace-content" id="workspaceContent"></main>
        </div>
    </div>
    <div class="workspace-sidebar-backdrop hidden" id="workspaceSidebarBackdrop"></div>
    <script src="/common.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/realtime-core-v1.js"></script>

    <script src="/community-groups-v3.js"></script>
    <script src="/realtime-chat-v2-adapter.js"></script>
    <script src="/realtime-groups-v2-adapter.js"></script>
    <script src="/realtime-calls-v3.js"></script>
    <script src="/profile-customization-v3.js"></script>
    <script src="/profile-name-decorations-v1.js"></script>
    <script src="/store-filter-controller-v2.js"></script>
    <script src="/brat-link.js"></script>
    <script src="/brat-page.js"></script>
    <script src="/workspace-feature-loader-v1.js?v=youtube-search-2&roblox-codes=1"></script>
    <script src="/workspace-menu-v2.js?v=youtube-menu-3"></script>
