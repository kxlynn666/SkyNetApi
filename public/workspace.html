<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#050506">
    <title>SkyNetApi Workspace</title>
    <link rel="stylesheet" href="/app.css">
    <link rel="stylesheet" href="/dashboard.css">
    <link rel="stylesheet" href="/ui-v3.css">
    <link rel="stylesheet" href="/design-system-v12.css">
    <link rel="stylesheet" href="/design-system-v14.css">
    <link rel="stylesheet" href="/profile-cosmetics.css">
    <link rel="stylesheet" href="/workspace-menu-v2.css">
</head>
<body class="workspace-body">
    <div class="workspace-loading" id="workspaceLoading">
        <div class="workspace-loading-mark">S</div>
        <div>Carregando workspace...</div>
    </div>
    <div class="workspace-shell hidden" id="workspaceShell">
        <aside class="workspace-sidebar" id="workspaceSidebar"></aside>
        <div class="workspace-main">
            <header class="workspace-topbar">
                <button class="workspace-menu-button" id="workspaceMenuButton" type="button" aria-label="Abrir menu">Menu</button>
                <div class="workspace-heading">
                    <div class="workspace-kicker" id="workspaceKicker"></div>
                    <h1 id="workspaceTitle"></h1>
                    <p id="workspaceDescription"></p>
                </div>
                <div class="workspace-user-chip" id="workspaceUserChip"></div>
            </header>
            <main class="workspace-content" id="workspaceContent"></main>
        </div>
    </div>
    <div class="workspace-sidebar-backdrop hidden" id="workspaceSidebarBackdrop"></div>

    <!-- Caminho crítico: sessão, prevenção de flash de rota e shell. -->
    <script src="/workspace-boot-guard-v1.js?v=2"></script>
    <script src="/workspace-core-v1.js?v=1"></script>
    <script src="/workspace-session-hotfix-v1.js?v=2"></script>
    <script src="/workspace-route-ready-v1.js?v=1"></script>
    <script src="/dashboard.js?v=panel-runtime-1"></script>
    <script src="/workspace-postboot-v1.js?v=route-ready-2"></script>

    <!-- Runtime pesado continua adiado por workspace-postboot-v1.js. -->
</body>
</html>
