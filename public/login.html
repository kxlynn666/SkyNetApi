<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#050506">
    <meta name="description" content="Entre no seu workspace SkyNetApi.">
    <title>Entrar - SkyNetApi</title>
    <link rel="stylesheet" href="/app.css">
    <link rel="stylesheet" href="/dashboard.css">
    <link rel="stylesheet" href="/design-system-v12.css">
    <link rel="stylesheet" href="/design-system-v14.css">
</head>
<body class="workspace-login-body">
    <main class="workspace-login-shell">
        <section class="workspace-login-brand">
            <a class="workspace-logo" href="/"><span>S</span><strong>SkyNetApi</strong></a>
            <div class="workspace-login-copy">
                <div class="workspace-kicker">SkyNetApi 2.0.3</div>
                <h1>Volte para o seu fluxo.</h1>
                <p>API, criação, perfil, chat, stocks, biblioteca e ferramentas continuam exatamente de onde você parou.</p>
            </div>
        </section>
        <section class="workspace-login-card">
            <div class="workspace-kicker">Acesso</div>
            <h2 id="loginTitle">Entrar na sua conta</h2>
            <p class="muted">Use suas credenciais do SkyNetApi.</p>
            <div class="message" id="loginMessage"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginUsername">Usuário</label>
                    <input id="loginUsername" autocomplete="username" minlength="3" maxlength="30" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Senha</label>
                    <input id="loginPassword" type="password" autocomplete="current-password" minlength="8" maxlength="128" required>
                </div>
                <button class="button primary workspace-login-submit" id="loginSubmit" type="submit">Entrar</button>
            </form>
            <p class="workspace-login-switch">Ainda não tem conta? <a href="/painel/cadastro">Criar workspace</a></p>
        </section>
    </main>
    <script src="/common.js"></script>
    <script src="/auth-login-v14.js"></script>
    <script>
    (() => {
        const S = window.SkyNet;
        const form = document.getElementById('loginForm');
        const message = document.getElementById('loginMessage');
        const button = document.getElementById('loginSubmit');
        function safeNext() {
            const next = new URLSearchParams(location.search).get('next') || '/painel';
            return next.startsWith('/painel') && !next.startsWith('//') ? next : '/painel';
        }
        form.addEventListener('submit', async event => {
            event.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            button.disabled = true;
            try {
                await S.api('/api/auth/login', { method: 'POST', body: { username, password } });
                location.replace(safeNext());
            } catch (error) {
                S.message(message, error.message, 'error');
            } finally {
                button.disabled = false;
            }
        });
        S.session().then(user => { if (user) location.replace(safeNext()); }).catch(() => {});
    })();
    </script>
</body>
</html>
