<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SkyNet Music</title>
  <link rel="stylesheet" href="/app.css">
  <style>
    body{margin:0;min-height:100vh;background:#09090f}.music-window{padding:20px;display:grid;gap:16px}.music-art{height:220px;border:1px solid var(--border);border-radius:24px;background:radial-gradient(circle at 30% 25%,rgba(168,85,247,.28),transparent 38%),linear-gradient(145deg,#12121d,#08080d);display:grid;place-items:center;overflow:hidden}.music-disc{width:118px;height:118px;border-radius:50%;border:18px solid rgba(255,255,255,.06);box-shadow:0 0 0 1px rgba(168,85,247,.25),0 18px 50px rgba(0,0,0,.4);display:grid;place-items:center;font-weight:900;font-size:28px}.music-disc.playing{animation:spin 7s linear infinite}.music-disc::after{content:'';width:18px;height:18px;border-radius:50%;background:#111;border:3px solid rgba(168,85,247,.4)}@keyframes spin{to{transform:rotate(360deg)}}.music-meta{text-align:center}.music-meta h1{font-size:22px;margin:0}.music-meta p{margin:5px 0 0;color:var(--muted)}.music-main-controls,.music-toggle-row{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}.music-main-controls .button.primary{min-width:110px}.music-volume{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.music-library{max-height:210px;overflow:auto;border:1px solid var(--border);border-radius:16px}.music-track{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--border);background:transparent;color:inherit;padding:12px;cursor:pointer}.music-track:last-child{border-bottom:0}.music-track.active{background:rgba(168,85,247,.1)}.music-track strong,.music-track span{display:block}.music-track span{font-size:11px;color:var(--muted)}.music-note{font-size:11px;color:var(--muted);line-height:1.5;text-align:center}
  </style>
</head>
<body>
  <main class="music-window">
    <div class="music-art"><div class="music-disc" id="musicDisc">S</div></div>
    <div class="music-meta"><h1 id="musicTitle">SkyNet Lo-fi Radio</h1><p id="musicArtist">Gerado localmente</p></div>
    <div class="music-main-controls"><button class="button" id="prevButton" type="button">Anterior</button><button class="button primary" id="playButton" type="button">Tocar</button><button class="button" id="nextButton" type="button">Próxima</button></div>
    <div class="music-volume"><span>Volume</span><input id="volumeInput" type="range" min="0" max="1" step="0.01" value="0.6"><span id="volumeValue">60%</span></div>
    <div class="music-toggle-row"><button class="button small" id="shuffleButton" type="button">Shuffle: off</button><button class="button small" id="repeatButton" type="button">Repeat: off</button></div>
    <div class="music-library" id="musicLibrary"><div class="empty">Carregando biblioteca...</div></div>
    <div class="music-note">A estação Lo-fi é sintetizada localmente. Arquivos da biblioteca são faixas enviadas pelo administrador.</div>
  </main>
  <script src="/music-popup.js"></script>
</body>
</html>
