name: Check SkyNetApi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax checks
        run: npm run check
      - name: Store and theme structural checks
        run: |
          node scripts/store-theme-selftest.js
          node scripts/profile-name-decorations-contract-test.js
          node scripts/theme-color-coverage-test.js
          node scripts/store-observer-selftest.js
      - name: Runtime dependency smoke test
        run: |
          node -e "const fs=require('fs'); const ffmpeg=require('ffmpeg-static'); if(!ffmpeg) throw new Error('ffmpeg-static sem binário'); fs.accessSync(ffmpeg); require('./src/tictactoe'); require('./src/profile-cosmetics-extra'); require('./src/profile-media'); const nameDecor=require('./src/profile-name-decorations'); if(!Array.isArray(nameDecor.NAME_CATALOG)||nameDecor.NAME_CATALOG.length<1) throw new Error('catálogo de nome vazio'); console.log('runtime modules OK')"
